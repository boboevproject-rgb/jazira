ReleaseNotes: |-
  - Автоскрытие («Расположение» → «Прятать — показывать при наведении»): остров уезжает за верхний край и оставляет тонкую полоску; курсор к полоске — остров выезжает.
  - Уведомления, Ctrl+Alt+J и файл, который тащат к полоске, показывают остров сами; спрятанный остров пропускает щелчки к окнам под ним.
  - По умолчанию выключено.
