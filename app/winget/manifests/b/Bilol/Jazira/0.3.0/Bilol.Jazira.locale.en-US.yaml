ReleaseNotes: |-
  - A koi pet that grows on water-goal days, with colours, a second fish and a story picture.
  - "My day": tasks with reminders from plain text, several timers, the next meeting from a calendar link, Ramadan mode.
  - New downloads and screenshots land on the shelf; Ctrl+PrtScn takes a screenshot without the island.
  - A System page and a 10% battery warning; Ctrl+Alt+J opens the island.
  - Drawn by the CPU: about 75 MB of memory instead of about 285 MB.
