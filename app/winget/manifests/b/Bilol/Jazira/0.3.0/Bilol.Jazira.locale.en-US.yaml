ShortDescription: A little island at the top of your Windows screen with music, lyrics, timers, water, files and tasks.
Description: |-
  Jazira lives at the top edge of Windows. Point at it and the island opens up: what is playing in any player with synced lyrics,
  "My day" with tasks, several timers and your next meeting from a secret iCal link, a shelf where new downloads and screenshots
  land on their own, a focus timer, a water tracker with a koi that grows on the days you hit your goal, and a System page with
  CPU, memory, heat, network and battery wear. Move away and it shrinks back into a quiet strip.
  Everything stays on your computer: no accounts, ads or tracking. Ctrl+Alt+J opens the island, Ctrl+PrtScn takes a screenshot.
  Run "jazira" once after installing; the tray icon has settings and start with Windows.
