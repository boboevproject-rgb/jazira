ShortDescription: "Маленький остров наверху экрана Windows: музыка, тексты песен, таймеры, вода, файлы и задачи."
Description: |-
  Jazira живёт у верхнего края Windows. Наведите курсор — остров раскроется: что играет в любом плеере и текст песни в такт,
  «Мой день» с задачами, несколькими таймерами и ближайшей встречей по секретной iCal-ссылке, полка, куда сами ложатся
  скачанные файлы и снимки экрана, таймер фокуса, вода с рыбкой-кои, которая растёт в дни, когда вы выпили норму,
  и страница «Система»: процессор, память, нагрев, сеть и износ батареи. Уберите курсор — остров снова станет тихой полоской.
  Всё хранится на вашем компьютере: без аккаунтов, рекламы и слежки. Ctrl+Alt+J открывает остров, Ctrl+PrtScn снимает экран.
  После установки один раз запустите «jazira»; настройки и автозапуск — в значке у часов.
