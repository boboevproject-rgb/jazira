ReleaseNotes: |-
  - Рыбка-питомец растёт в дни, когда выпита норма воды: окраски, вторая рыбка, картинка для сторис.
  - «Мой день»: задачи с напоминанием прямо из текста, несколько таймеров, ближайшая встреча из календаря, режим Рамазана.
  - Скачанное и снимки экрана сами ложатся на полку; Ctrl+PrtScn снимает экран без острова.
  - Страница «Система» и предупреждение о 10 % батареи; Ctrl+Alt+J открывает остров.
  - Остров рисует процессор: около 75 МБ памяти вместо примерно 285 МБ.
